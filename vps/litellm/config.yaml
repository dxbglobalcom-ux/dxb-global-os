# DXB LiteLLM proxy config — master-plan PHASE-04 §3 skeleton with slugs
# live-verified 2026-07-07 (study-cards/litellm.md verified slug table;
# CEO approval: 04-01-legitimacy-approval.md). Keys env-only (A8 vault).
model_list:
  - model_name: glm-5.2
    litellm_params: { model: openrouter/z-ai/glm-5.2, api_key: os.environ/OPENROUTER_API_KEY }
  - model_name: embed-small
    # Phase-6 embedding pin (06-01; study-cards/litellm.md Embeddings section): 1536-dim, $0.02/M
    litellm_params: { model: openrouter/openai/text-embedding-3-small, api_key: os.environ/OPENROUTER_API_KEY }
    model_info: { mode: embedding }
  - model_name: kimi-2.7-code
    # master-plan slug moonshotai/kimi-2.7 is not live on OpenRouter;
    # CEO-selected replacement (04-01 checkpoint): kimi-k2.7-code
    litellm_params: { model: openrouter/moonshotai/kimi-k2.7-code, api_key: os.environ/OPENROUTER_API_KEY }
  - model_name: deepseek-v4-flash
    litellm_params: { model: openrouter/deepseek/deepseek-v4-flash, api_key: os.environ/OPENROUTER_API_KEY }
  - model_name: qwen3.6-flash
    litellm_params: { model: openrouter/qwen/qwen3.6-flash, api_key: os.environ/OPENROUTER_API_KEY }
  - model_name: minimax-m3
    litellm_params: { model: openrouter/minimax/minimax-m3, api_key: os.environ/OPENROUTER_API_KEY }
  # §4c exam wiring 2026-07-25 — CEO-ordered candidates (C12), catalog status
  # 'testing' until their exams pass. OpenRouter ids MEASURED from the live
  # /api/v1/models listing this session (no guessed slugs):
  #   moonshotai/kimi-k3        ctx 1,048,576  $3.00/M in  $15.00/M out
  #   deepseek/deepseek-v4-pro  ctx 1,048,576  $0.435/M in  $0.87/M out
  # NOTE kimi-k3 pricing is PREMIUM-tier — activation is a CEO cost decision,
  # not an automatic post-exam step (C2 order names the replacement chain).
  - model_name: kimi-3
    litellm_params: { model: openrouter/moonshotai/kimi-k3, api_key: os.environ/OPENROUTER_API_KEY }
  - model_name: deepseek-v4-pro
    litellm_params: { model: openrouter/deepseek/deepseek-v4-pro, api_key: os.environ/OPENROUTER_API_KEY }
  # ANTHROPIC MODELS REMOVED (CEO order 2026-07-19, complaint ledger C2):
  # OpenRouter carries ONLY low-cost/Chinese models. Anthropic models run
  # exclusively over the subscription path (worker-shim mode='subscription',
  # Agent SDK local auth) — never through this proxy. Measured trigger:
  # $2.80 real Sonnet spend on the CEO's OpenRouter panel (7d).
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  salt_key: os.environ/LITELLM_SALT_KEY           # 07-05: stable salt so virtual keys survive restarts
  database_url: os.environ/LITELLM_DATABASE_URL   # Supabase Postgres, schema litellm (LOCKED single-DB)
litellm_settings:
  max_budget: 100          # EUR/month equivalent — adjust to USD rate on VPS install day
  budget_duration: 30d
  drop_params: true        # 07-06: hermes sends `reasoning`; OpenRouter chat route rejects
                           # unknown params — drop instead of 400 (quality unaffected:
                           # params silently unsupported upstream anyway)
