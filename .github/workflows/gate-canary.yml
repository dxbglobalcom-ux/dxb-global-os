# DXB Global OS — CI gate canary (GATE-04)
#
# README (required check): mark the `canary` job as a REQUIRED status check in
# branch protection the moment this repo gets a GitHub remote. Until then the
# same test file is enforced locally — it lives under tests/** and therefore
# runs inside `pnpm test` on every verification pass.
#
# The three scenarios in tests/phase4/gate-canary.test.ts are ⛔ FABLE-ONLY
# locked (master-plan §3): weakening any scenario or this workflow's trigger
# set is a governance violation, not a refactor.
name: gate-canary

on: [push, pull_request]

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 tag, resolved 2026-08-26
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 tag, resolved 2026-08-26
        with:
          node-version: 22
      - name: Enable pnpm via Corepack (version pinned by packageManager)
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build workspace
        run: pnpm build
      - name: Start local Supabase (Postgres + triggers under test)
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1 tag, resolved 2026-08-26
        with:
          version: 2.109.0
      - run: supabase start
      - name: Run gate canary (3 locked scenarios + negative control)
        run: pnpm vitest run tests/phase4/gate-canary.test.ts
