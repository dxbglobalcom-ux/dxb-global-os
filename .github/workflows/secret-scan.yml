# DXB Global OS — CI full-history secret scan (SEC-03 defense in depth)
#
# Notes:
# 1. This repo has no GitHub remote yet — this workflow arms automatically
#    on the first push to GitHub.
# 2. gitleaks-action is free for personal repos; ORG repos need a
#    GITLEAKS_LICENSE secret (free to request) — RESEARCH assumption A7.
# 3. SHA-pinned 2026-07-09 (07-08 Task 1, T-01-SC discharged): @v2 major tag
#    resolved via `git ls-remote https://github.com/gitleaks/gitleaks-action v2`
#    → dcedce43c6f43de0b836d1fe38946645c9c638dc (no v2.x.y release tag matches;
#    this IS what @v2 executed on pin day). Renewal = deliberate diff of this SHA.
name: secret-scan

on: [push, pull_request]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history on every run
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2 tag, resolved 2026-07-09
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
